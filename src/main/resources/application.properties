# Application Configuration
spring.application.name=biblioteca-escolar
server.port=8080

# Database Configuration
# En producción definir las variables de entorno DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_escolar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# validate: el esquema lo controla Flyway (db/migration), Hibernate solo lo verifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway (versionamiento del esquema)
spring.flyway.locations=classpath:db/migration
# Si la BD ya existe (creada antes de Flyway) se toma como línea base y no falla
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logging (desarrollo)
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# En producción definir JWT_SECRET (mínimo 32 caracteres) y JWT_EXPIRATION
jwt.secret=${JWT_SECRET:mySecretKeyForJWTGenerationWithEnoughLengthAtLeast32Characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Remember-Me (vista Thymeleaf)
remember.me.key=${REMEMBER_ME_KEY:uniqueAndSecret}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sort=method
springdoc.packages-to-scan=com.biblioteca.escolarbiblioteca.controller

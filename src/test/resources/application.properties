# =====================================================================
# Configuración para TESTS (Fase 4) - sobrescribe application.properties
# Usa H2 en memoria: los tests NO tocan tu MySQL de XAMPP.
# =====================================================================

# Base de datos en memoria en modo MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# El esquema lo genera Hibernate desde las entidades (el V1__init.sql es MySQL-specific)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Devtools off en tests
spring.devtools.restart.enabled=false

# JWT de prueba
jwt.secret=testSecretKeyForJwtTestingWithEnoughLength32Chars
jwt.expiration=3600000
remember.me.key=testRememberMeKey

# Logging silencioso
logging.level.root=WARN
logging.level.com.biblioteca.escolarbiblioteca=INFO
